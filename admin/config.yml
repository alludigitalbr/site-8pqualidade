# ============================================================
# EDITOR DE CONTEÚDO (Decap CMS) — 8P Gestão & Negócios
# Autenticação via DecapBridge (PKCE) — login sem acesso ao GitHub.
# Convide colaboradores (ex: Tauã) no painel da DecapBridge, aba
# "Manage collaborators".
# ============================================================
backend:
  name: git-gateway
  repo: alludigitalbr/site-8pqualidade
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/85b8e31a-ee0e-410b-81a7-c2f096f59bac/pkce
  auth_token_endpoint: /sites/85b8e31a-ee0e-410b-81a7-c2f096f59bac/token
  gateway_url: https://gateway.decapbridge.com

  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

site_url: https://8pqualidade.com.br
display_url: https://8pqualidade.com.br
logo_url: /assets/img/logo-8p.png

media_folder: "assets/img/noticias"
public_folder: "/assets/img/noticias"

collections:
  - name: "posts"
    label: "Notícias"
    label_singular: "Notícia"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{category}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime" }
      - label: "Categoria"
        name: "category"
        widget: "select"
        options:
          - "ISO 9001"
          - "IATF 16949"
          - "ISO 14001"
          - "ISO 45001"
          - "Ferramentas da Qualidade"
          - "Lean Manufacturing"
          - "Treinamentos"
          - "Auditorias"
      - { label: "Destaque na página de Notícias", name: "featured", widget: "boolean", default: false }
      - { label: "Resumo (aparece nos cards)", name: "excerpt", widget: "text" }
      - { label: "Imagem de capa", name: "image", widget: "image", required: false }
      - { label: "Conteúdo", name: "body", widget: "markdown" }

  - name: "guias"
    label: "Guias e Materiais"
    label_singular: "Guia"
    folder: "_guias"
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descrição (aparece no card)", name: "description", widget: "text" }
      - { label: "Arquivo PDF", name: "file", widget: "file", media_folder: "assets/guias", public_folder: "/assets/guias" }
      - { label: "Texto da página do guia", name: "body", widget: "markdown", required: false }
