---
layout: default
---
<article class="section post-single">
  <div class="container post-single-inner">
    <a href="/noticias/" class="post-back"><i>←</i> Voltar para Notícias</a>
    <span class="post-category">{{ page.category }}</span>
    <h1 class="post-title">{{ page.title }}</h1>
    <div class="post-meta">
      <span>{{ page.date | date: "%d de %B de %Y" }}</span>
      {% if page.author %}<span>· {{ page.author }}</span>{% endif %}
    </div>
    {% if page.image %}
    <div class="post-cover"><img src="{{ page.image | relative_url }}" alt="{{ page.title }}" loading="lazy"></div>
    {% endif %}
    <div class="post-body">
      {{ content }}
    </div>
  </div>
</article>
